name: Poll N1763W flight status

on:
  schedule:
    - cron: "*/10 13-23,0-5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check N1763W ADS-B status
        run: python3 scripts/poll_flight.py

      - name: Commit flight update if changed
        run: |
          if git diff --quiet data/flights.json; then
            echo "No flight status change — skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flights.json
          git commit -m "Log N1763W flight update"
          git push